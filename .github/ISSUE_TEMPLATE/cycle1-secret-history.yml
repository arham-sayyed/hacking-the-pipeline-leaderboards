name: "Cycle 1 — Secret in Git History"
description: Submit the flag you recovered from a deleted-but-still-there commit.
title: "[Cycle 1] Flag submission"
labels: ["cycle1", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        Paste exactly what you found. Nothing else in this field.
  - type: input
    id: flag
    attributes:
      label: Flag
      placeholder: HAXN{...}
    validations:
      required: true
