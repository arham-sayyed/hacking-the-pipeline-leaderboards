name: "Cycle 3 — Leaked .env in the Build Artifact"
description: Submit the flag you found inside a downloaded build artifact.
title: "[Cycle 3] Flag submission"
labels: ["cycle3", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        Paste exactly what you found. Nothing else in this field.
  - type: input
    id: flag
    attributes:
      label: Flag
      placeholder: HAXN{...}
    validations:
      required: true
